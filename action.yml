name: 'PromptDiff Prompt Regression Testing'
description: 'Automated LLM prompt regression testing, cost/latency gating, and PR sticky comment reporter.'
author: 'promptdiff team'
branding:
  icon: 'git-pull-request'
  color: 'purple'

inputs:
  v1:
    description: 'Path to baseline v1 prompt file or raw text'
    required: true
  v2:
    description: 'Path to candidate v2 prompt file or raw text'
    required: true
  inputs:
    description: 'Path to test dataset (.jsonl, .yaml, .csv, .json)'
    required: false
  model:
    description: 'Target LLM model (e.g. gpt-4o, claude-3-5-sonnet, gemini-2.0-flash)'
    required: false
    default: 'gpt-4o'
  eval:
    description: 'Comma-separated evaluation metrics to run'
    required: false
    default: 'json_validity,latency,cost,similarity,faithfulness,security'
  assertions:
    description: 'Comma-separated assertions threshold (e.g. "cost_delta <= 15%, latency_delta <= 20%")'
    required: false
  mock:
    description: 'Use deterministic mock provider (no API keys required)'
    required: false
    default: 'false'
  github-token:
    description: 'GitHub token for posting sticky PR comments (e.g. secrets.GITHUB_TOKEN)'
    required: false
  export-html:
    description: 'Path to export interactive HTML report'
    required: false
    default: 'promptdiff-report.html'
  export-markdown:
    description: 'Path to export Markdown report'
    required: false
    default: 'promptdiff-report.md'
  export-bundle:
    description: 'Path to export standalone single-file HTML bundle'
    required: false
    default: 'promptdiff-bundle.html'
  export-json:
    description: 'Path to export JSON report'
    required: false
    default: 'promptdiff-report.json'
  fail-on-regression:
    description: 'Fail CI job if regression assertion is violated'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install promptdiff
      shell: bash
      run: |
        python -m pip install --upgrade pip
        if [ -f "pyproject.toml" ]; then
          pip install -e .
        else
          pip install promptdiff-eval
        fi

    - name: Run promptdiff regression tests
      shell: bash
      env:
        INPUT_V1: ${{ inputs.v1 }}
        INPUT_V2: ${{ inputs.v2 }}
        INPUT_INPUTS: ${{ inputs.inputs }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_EVAL: ${{ inputs.eval }}
        INPUT_ASSERTIONS: ${{ inputs.assertions }}
        INPUT_MOCK: ${{ inputs.mock }}
        INPUT_EXPORT_HTML: ${{ inputs.export-html }}
        INPUT_EXPORT_MARKDOWN: ${{ inputs.export-markdown }}
        INPUT_EXPORT_BUNDLE: ${{ inputs.export-bundle }}
        INPUT_EXPORT_JSON: ${{ inputs.export-json }}
        INPUT_FAIL_ON_REGRESSION: ${{ inputs.fail-on-regression }}
      run: |
        ARGS=("test" "$INPUT_V1" "$INPUT_V2")
        if [ -n "$INPUT_INPUTS" ]; then
          ARGS+=(--inputs "$INPUT_INPUTS")
        fi
        if [ -n "$INPUT_MODEL" ]; then
          ARGS+=(--model "$INPUT_MODEL")
        fi
        if [ -n "$INPUT_EVAL" ]; then
          ARGS+=(--eval "$INPUT_EVAL")
        fi
        if [ -n "$INPUT_ASSERTIONS" ]; then
          IFS=',' read -ra ADDR <<< "$INPUT_ASSERTIONS"
          for a in "${ADDR[@]}"; do
            trimmed=$(echo "$a" | xargs)
            if [ -n "$trimmed" ]; then
              ARGS+=(--assert "$trimmed")
            fi
          done
        fi
        if [ "$INPUT_MOCK" = "true" ]; then
          ARGS+=(--mock)
        fi
        if [ -n "$INPUT_EXPORT_HTML" ]; then
          ARGS+=(--export-html "$INPUT_EXPORT_HTML")
        fi
        if [ -n "$INPUT_EXPORT_MARKDOWN" ]; then
          ARGS+=(--export-markdown "$INPUT_EXPORT_MARKDOWN")
        fi
        if [ -n "$INPUT_EXPORT_BUNDLE" ]; then
          ARGS+=(--export-bundle "$INPUT_EXPORT_BUNDLE")
        fi
        if [ -n "$INPUT_EXPORT_JSON" ]; then
          ARGS+=(--export-json "$INPUT_EXPORT_JSON")
        fi
        if [ "$INPUT_FAIL_ON_REGRESSION" = "false" ]; then
          ARGS+=(--no-fail-on-regression)
        fi
        promptdiff "${ARGS[@]}"

    - name: Post Sticky PR Comment
      if: ${{ inputs.github-token != '' && github.event_name == 'pull_request' }}
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        path: ${{ inputs.export-markdown }}
        header: promptdiff-regression-evaluation
