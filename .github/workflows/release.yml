name: Release & Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build-and-publish:
    name: Build distribution & Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Validate distribution packages
        run: |
          twine check dist/*

      - name: Sign distribution packages with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Install Cosign for container and artifact verification
        uses: sigstore/cosign-installer@v3.8.2

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Verify package on PyPI and record summary
        run: |
          PACKAGE_NAME="promptdiff-eval"
          echo "### 🚀 PyPI Distribution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Package:** \`$PACKAGE_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PyPI Project URL:** [https://pypi.org/project/$PACKAGE_NAME/](https://pypi.org/project/$PACKAGE_NAME/)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "Querying PyPI API for indexed release versions..."
          # Polling loop to allow PyPI index CDN to reflect newly published distribution
          for i in {1..6}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PACKAGE_NAME/json" || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              LATEST_VERSION=$(curl -s "https://pypi.org/pypi/$PACKAGE_NAME/json" | python -c "import sys, json; print(json.load(sys.stdin).get('info', {}).get('version', 'unknown'))" 2>/dev/null || echo "unknown")
              echo "✅ Verified package on PyPI! Current indexed version: $LATEST_VERSION"
              echo "- **Status:** ✅ Successfully published to PyPI" >> $GITHUB_STEP_SUMMARY
              echo "- **Latest PyPI Version:** \`$LATEST_VERSION\`" >> $GITHUB_STEP_SUMMARY
              break
            else
              echo "Attempt $i: PyPI index pending (HTTP $HTTP_STATUS). Retrying in 10s..."
              sleep 10
            fi
          done

          echo "Checking available versions via pip index..."
          pip index versions "$PACKAGE_NAME" || true

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: bom.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            bom.json
          generate_release_notes: true
          draft: false
          prerelease: false

  docker-build:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
