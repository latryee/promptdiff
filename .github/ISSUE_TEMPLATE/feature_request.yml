name: Feature Request
description: Propose a new feature, evaluator, or enhancement for promptdiff
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for PromptDiff? Let's discuss it!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a specific problem or missing capability?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution or how the API/CLI should behave.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples here.
