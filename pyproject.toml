[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "promptdiff"
version = "3.4.0"
description = "Enterprise-grade async LLM Prompt Regression Testing, DSPy Auto-Optimizer, RAG Evaluators, Security Guardrails, and Streamlit Dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "promptdiff team" }
]
keywords = ["llm", "prompt-engineering", "testing", "regression", "diff", "eval", "cli", "ai-engineering", "mlops", "llm-judge", "dspy", "rag", "streamlit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "tenacity>=8.2.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/latryee/promptdiff"
Repository = "https://github.com/latryee/promptdiff"
Issues = "https://github.com/latryee/promptdiff/issues"
Documentation = "https://github.com/latryee/promptdiff#readme"
Changelog = "https://github.com/latryee/promptdiff/blob/main/CHANGELOG.md"

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=2.2.0",
]
ui = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
]
tui = [
    "textual>=0.50.0",
]
all = [
    "sentence-transformers>=2.2.0",
    "streamlit>=1.30.0",
    "textual>=0.50.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "genbadge[all]>=1.1.0",
]
mlops = [
    "mlflow>=2.10.0",
    "wandb>=0.16.0",
]

[project.scripts]
promptdiff = "promptdiff.cli.app:main"

[project.entry-points.pytest11]
promptdiff = "promptdiff.pytest_plugin"

[tool.setuptools.packages.find]
include = ["promptdiff*"]

[tool.setuptools.package-data]
promptdiff = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-p no:promptdiff -v --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    ".promptdiff_cache",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "UP007", "UP045", "B008", "B904"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["promptdiff"]
omit = [
    "promptdiff/ui/*",
    "promptdiff/tui/*",
    "promptdiff/cli/*",
    "promptdiff/lsp/*",
    "promptdiff/pytest_plugin.py",
    "promptdiff/reporters/mlflow_reporter.py",
    "promptdiff/reporters/wandb_reporter.py",
    "promptdiff/reporters/otel_reporter.py",
    "promptdiff/reporters/pr_bot.py",
    "promptdiff/reporters/notebook.py",
    "promptdiff/providers/openai_provider.py",
    "promptdiff/providers/anthropic_provider.py",
    "promptdiff/providers/gemini_provider.py",
    "promptdiff/providers/ollama_provider.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
